# Audiobook Organizer Cargo workspace root (v0.1.0 spine, Phase 1).
#
# This is a virtual manifest: it builds no crate of its own. The two real
# members are the Tauri-free engine crate (abo-core) and the thin Tauri shell
# (src-tauri). The load-bearing rule, set here and enforced in CI
# (docs/internal/ci-plan.md lint job, "Assert abo-core has no tauri
# dependency"): abo-core must never depend on tauri or any tauri-* crate,
# even transitively (D-01, D-07).
#
# Version pins in [workspace.dependencies] are adopted from the working,
# already-building reference project's root manifest:
#   E:/Projects/product-on-purpose/repo-sync-tool/Cargo.toml
# treated as last-known-good per this phase's brief (item 4) and the v0.1.0
# spec's reference-architecture pointer. Tauri-family crates and tauri-specta
# are pinned EXACT (= prefix, no caret) per AC-17, even though src-tauri does
# not consume tauri-specta yet (Phase 5 wires the seam). tokio and sqlx are
# declared now but not yet consumed by any crate; Phase 2 (database) and
# Phase 3 (scanner) wire them in. git2 and reqwest from the reference project
# are deliberately NOT carried forward: Audiobook Organizer has no git
# integration and a zero-network-at-runtime posture (this phase's brief;
# FD-11), so no HTTP client dependency is ever added.

[workspace]
resolver = "2"
members = ["crates/abo-core", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["prisant-labs"]
repository = "https://github.com/prisant-labs/audiobook-organizer"

[workspace.dependencies]
# Tauri stack. EXACT pins (= prefix) are load-bearing per AC-17: tauri-specta
# v2 is a release candidate and a silent RC bump would break IPC codegen
# (Phase 5). Pins copied verbatim from repo-sync-tool's working, already
# resolved (Cargo.lock present there) Cargo.toml.
tauri = "=2.11.5"
tauri-build = "=2.6.3"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = "=2.0.0-rc.25"

# Shared logic-crate dependencies. specta has no tauri dependency of its own
# (verified via `cargo tree`, both here and in the reference project); only
# tauri-specta, the glue crate, lives in src-tauri.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

# Consumed from Phase 2 (database) onward. tokio's `full` feature set is what
# the shell wants; abo-core pulls only the test-time subset it needs (see
# crates/abo-core/Cargo.toml [dev-dependencies]).
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false }

# futures (shell-only). Used by src-tauri for `FutureExt::catch_unwind`, which
# makes the spawned scan job's terminal-state handling panic-safe: a panic in the
# scan future is caught and the `jobs` row is marked failed rather than left stuck
# in 'running'. Core-pure (no tauri, no network); it is deliberately NOT added to
# abo-core, whose zero-tauri gate is unaffected because futures never lands there.
futures = "0.3.32"

# Structured logging (F-1003). tracing has no tauri dependency (core-purity
# safe) and no network dependency; abo-core uses it to log the corrupt-DB
# recovery path and the scan lifecycle. The `log` feature is enabled where the
# crate is consumed (abo-core) so tracing events are ALSO emitted as `log`
# facade records; that is the bridge by which core tracing events reach
# tauri-plugin-log (a `log::Log` logger) in the shell (this phase's brief item 3).
tracing = "0.1.44"

# tauri-plugin-log (F-1003): the shell's file+stdout logger. Tauri-family crate,
# so pinned EXACT (= prefix) per AC-17. Backend-only usage (Rust Builder); the JS
# guest package (@tauri-apps/plugin-log) is deliberately NOT added because the
# frontend does not log through the plugin (this phase's brief item 3). This
# crate is a `log::Log` implementation; it captures the `log` facade, which is
# how abo-core's tracing events (via tracing's `log` feature) reach the log file.
tauri-plugin-log = "=2.9.0"

# tauri-plugin-single-instance (v0.5.0 P3, AC-8 single-writer): makes the app a
# single desktop instance so a second launch focuses the existing window and exits,
# rather than a second process opening the same database. This is what makes the
# apply single-writer lock PROCESS-WIDE (the durable `running` apply row + the
# startup reclaim assume no other live instance holds the lock). Tauri-family crate,
# pinned EXACT (= prefix) per AC-17. `default-features = false`: the optional
# `deep-link`/`semver` features stay OFF, so the plugin has NO JS guest package and
# adds NO capability/permission (the capability baseline stays at exactly 7).
tauri-plugin-single-instance = { version = "=2.4.3", default-features = false }

# tauri-plugin-dialog (F-909, FD-29): the OS folder picker used at first-run and
# in Settings to choose the library root. Tauri-family crate, so pinned EXACT
# (= prefix) per AC-17. This is the ONLY new capability the security model adds
# this release; there is deliberately no tauri-plugin-fs and no tauri-plugin-shell
# (architecture Section 5). The matching JS guest package (@tauri-apps/plugin-dialog)
# is added to package.json at the same pinned 2.7.1 so the Rust plugin and the JS
# `open()` binding agree. Backend-mediated: the picked path is handed to the
# backend via settings_set; the WebView never gains a standing filesystem scope.
tauri-plugin-dialog = "=2.7.2"

# Per-push CI / default release profile (FD-24). Tuned for a small bundle but
# with THIN LTO and parallel codegen so per-push CI builds stay fast (the
# reference project measured a full-LTO single-codegen-unit build at about 35
# minutes on the Windows runner). Maximal-size public artifacts use
# [profile.dist] below.
[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
codegen-units = 16

# Distribution profile for public release-tag artifacts: maximal size
# optimization (full LTO, single codegen unit), accepting the longer build
# time. The Phase 7 release workflow selects it (`pnpm tauri build --profile
# dist`); per-push CI does not use it.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
