# Dependency update automation (ci-plan.md Section 10 posture: weekly, grouped,
# agent triages). Tauri-family and specta crates are exact-pinned; dependabot
# PRs touching them get reviewed against the pin policy, never auto-merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      js-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
