[package]
name = "abo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# abo-core is the Tauri-free engine crate (D-01, D-07 engine-first order).
# The load-bearing invariant, enforced in CI (docs/internal/ci-plan.md lint
# job): this crate must never depend on `tauri` or any `tauri-*` crate, even
# transitively. `cargo tree -p abo-core -e normal | grep -i tauri` must stay
# empty (AC-3).
#
# Phase 1 added serde, thiserror, and specta for the stub derives. Phase 2
# (database) adds sqlx (runtime query API only), tracing, and the AppError
# Storage family. specta and sqlx pull no tauri dependency (verified by
# `cargo tree -p abo-core -e normal | grep -i tauri`, which must stay empty,
# AC-3); only tauri-specta, the glue crate, lives in src-tauri.
#
# sqlx uses the RUNTIME query API (sqlx::query / query_as / bind), NEVER the
# compile-time-checked query! macros, so the build needs no DATABASE_URL and no
# offline query cache. The `macros` feature is enabled solely for
# sqlx::migrate! (which lives in sqlx-macros); it does not force use of query!.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
specta = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# The `log` feature makes every `tracing` event ALSO emit a `log` facade record
# when no `tracing` Subscriber is installed (which is exactly the shell's setup:
# tauri-plugin-log is a `log::Log` logger, not a tracing Subscriber). This is the
# bridge that carries abo-core's scan-lifecycle events into the shell's log file
# (F-1003). Proven by tests/tracing_log_bridge.rs. Pulls only the tiny `log`
# facade crate: no tauri, no network, so the core-purity gate stays green.
tracing = { workspace = true, features = ["log"] }

# v0.3.0 Phase 3 (F-801 ruleset model): a ruleset is persisted as a
# schema-versioned JSON body, and AC-29 requires parsing that body, validating
# it against the versioned shape, and rejecting a malformed/invalid body on
# save with a machine code. serde is already a normal dependency; serde_json
# gives the ruleset a real JSON (de)serializer for that round-trip and
# validation instead of hand-rolling a parser. It is a pure crate (itoa + ryu +
# memchr, plus serde), so the core-purity gate (`cargo tree -p abo-core -e
# normal | grep -i tauri`) and the zero-network gate (tests/no_network.rs) both
# stay green. Promoted from a dev-dependency (where the error-taxonomy tests
# already used it) to a normal one.
serde_json = { workspace = true }

# Phase 3 (scanner) adds walkdir for the recursive traversal (F-101). walkdir
# pulls only same-file + winapi-util (no tauri, no network), so the core-purity
# gate (`cargo tree -p abo-core -e normal | grep -i tauri`) stays empty. Windows
# extended-length (`\\?\`) semantics and the reparse-point check are handled with
# std (`std::fs::canonicalize`, `std::os::windows::fs::MetadataExt`) plus two
# documented `FILE_ATTRIBUTE_*` constants, so no winapi/windows-sys direct dep is
# added. ISO-8601 timestamps are hand-formatted (Hinnant civil-from-days), so the
# core still carries no chrono/time dependency (migration 0001 comment).
walkdir = "2"

# v0.2.0 Phase 2 (F-101 exclude patterns, the minimal ruleset scope for this
# release): globset compiles the caller-supplied exclude glob strings into a
# matcher. Pure (aho-corasick + regex-automata + regex-syntax), no tauri and no
# network, so the core-purity gate (`cargo tree -p abo-core -e normal | grep -i
# tauri`) and the zero-network gate (tests/no_network.rs) both stay green.
globset = "0.4"

# v0.2.0 Phase 4a (F-301 pattern matchers, F-302 noise strippers): the parse
# module recognizes and strips naming noise with real regular expressions
# rather than hand-rolled string scanning, since the seed recipes this phase
# adapts from (_local/prior-work/bulkrename_chatgpt.md,
# _local/prior-work/chatgpt_shell.md) are themselves written as regexes.
# `regex` pulls only regex-syntax, regex-automata, aho-corasick, and memchr
# (no tauri, no network), so the core-purity gate and the zero-network gate
# (tests/no_network.rs) both stay green.
regex = "1"

# v0.2.0 Phase 4b (F-304 name normalizer): NFC normalization (AC-304.3) and
# grapheme-safe word-boundary truncation (AC-304.4). `unicode-normalization`
# supplies the NFC pass so an NFC and an NFD spelling of the same title
# collapse to a byte-identical component; `unicode-segmentation` supplies
# grapheme-cluster iteration so a length cap never splits a multi-code-point
# grapheme. Both are pure table-driven crates (unicode-normalization pulls
# only tinyvec; unicode-segmentation pulls nothing): no tauri and no network,
# so the core-purity gate (`cargo tree -p abo-core -e normal | grep -i tauri`)
# and the zero-network gate (tests/no_network.rs) both stay green. Pinned to
# the versions already resolved in Cargo.lock (no pin exists in the reference
# project E:/Projects/product-on-purpose/repo-sync-tool).
unicode-normalization = "0.1"
unicode-segmentation = "1"

# v0.2.0 Phase 3 (F-102 WizTree CSV import): WizTree quotes its `File Name`
# column (many real paths embed commas, see the WizTree_2026-03-25.csv fixture),
# so a real RFC4180 parser is needed rather than a naive comma split. `csv`
# pulls only csv-core, memchr, itoa and ryu (no tauri, no network), so both the
# core-purity and zero-network gates stay green. `.flexible(true)` (set at each
# `ReaderBuilder` call site) is load-bearing: real WizTree rows have either 9 or
# 13 fields depending on whether the drive-capacity columns are present (they
# only ever are on the first data row), and `csv`'s default header-length
# enforcement would otherwise reject every short row.
csv = "1"

# lofty reads embedded audio metadata from real files, READ-ONLY. It serves two
# consumers, both read-only, and is a NORMAL (non-optional) dependency as of
# v0.4.0 Phase 3:
#
#   1. F-907 cover extraction (v0.4.0, D-15/FD-03): `scan::cover` reads the first
#      embedded picture frame of a book's audio file for the cover-forward home
#      and review surfaces. This is a PRODUCTION code path the release ships, so
#      lofty is compiled into the default build - hence promoted from the
#      `optional = true` it carried when only the probe used it. `scan::cover`
#      NEVER opens a file write-mode and NEVER writes tags or images (D-09
#      read-only invariant; proven by the read-only assertion test in
#      tests/cover_extraction.rs).
#   2. The FD-14 tag-quality probe (v0.2.0, G-08), still gated behind the `probe`
#      feature (see [features] below): the probe MODULE stays opt-in and off by
#      default, but its dependency (lofty) is now always present because covers
#      need it too. Promoting lofty does not turn the probe on - `probe` gates the
#      `crate::probe` module, not the crate.
#
# lofty is a pure local metadata parser: it pulls no tauri and no HTTP client
# (verified by the core-purity `cargo tree -p abo-core -e normal | grep -i tauri`
# check - now over the DEFAULT feature set, since lofty is normal - and by
# tests/no_network.rs), so both gates stay green. EXACT-pinned per the workspace
# convention (no pin exists in the reference project
# E:/Projects/product-on-purpose/repo-sync-tool) so a silent lofty bump cannot
# change what the recorded FD-14 verdict was measured against, nor what the cover
# reader was tested over.
lofty = "=0.25.1"

# blake3 computes the content hash that turns a duplicate CANDIDATE into a
# proven duplicate (F-702, v0.6.0 P2). Chosen over SHA-256 for throughput: this
# runs over multi-gigabyte audio files on a desktop, and the security properties
# of a cryptographic hash are not what is wanted here - only that two different
# files reliably produce different digests.
#
# Scope discipline (AC-10): hashing is CANDIDATES-ONLY. Nothing in the scan path
# hashes, and no full-snapshot hash-everything code path exists. The only caller
# is the duplicate verification job, over members of an already-detected group.
#
# Pure computation with no I/O of its own: the bytes are fed to it by the caller
# through a narrow read seam, which is what keeps the executor's Vfs trait free
# of a read method it does not need. No network (tests/no_network.rs covers the
# whole default feature set), no tauri.
#
# EXACT-pinned per the workspace convention, so a silent bump cannot change what
# a persisted hash means.
blake3 = "=1.8.7"

# v0.2.0 Phase 2 (FD-19 LongPathsEnabled detection): read the registry value
# HKLM SYSTEM\CurrentControlSet\Control\FileSystem LongPathsEnabled to decide
# whether a warning is warranted when a recorded path exceeds the legacy 260-char
# limit. Windows-only (POSIX has no MAX_PATH), pulls only windows-sys, no tauri
# and no network, so both gates stay green.
# The F-606 kill-recovery harness (src/bin/kill_harness.rs) is an async binary, so
# it needs a runtime of its own - the library itself stays runtime-agnostic and
# runs on whatever the shell provides. OPTIONAL and off by default: only the
# `kill-harness` feature turns it on, so the shipped build and the core-purity
# gate are unaffected. tokio is already in the graph transitively via sqlx's
# `runtime-tokio`, so this adds no new crate, only a direct name to `use`.
tokio = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[features]
# v0.2.0 Phase 1: gates the `fixtures` module (see src/fixtures/mod.rs doc
# comment). Off by default so the fixture generator never reaches the
# production shell build; the self dev-dependency below turns it on
# automatically for `cargo test -p abo-core`, including integration tests
# under tests/*.rs, without any caller needing to pass --features.
fixtures = []

# v0.2.0 Phase 7: gates the `probe` module (the FD-14 tag-quality probe). Off by
# default and DELIBERATELY NOT auto-enabled by the self dev-dependency below, so
# the default `cargo test -p abo-core` and `cargo test --workspace` do not build
# the probe module and the FD-14 probe stays opt-in via
# `cargo test -p abo-core --features probe`. The one integration test that
# consumes it (tests/fd14_tag_probe.rs) guards its whole body with
# `#![cfg(feature = "probe")]`, so it compiles to nothing (no missing-symbol
# error) in the default no-probe build and for real only under `--features probe`.
#
# As of v0.4.0 Phase 3 this no longer carries `dep:lofty`: lofty was promoted to a
# normal dependency for F-907 cover extraction (see the `lofty` dependency comment
# above), so it is always compiled regardless of this feature. `probe` now gates
# ONLY the `crate::probe` module, which is the correct scope - the FD-14 probe
# code path is still opt-in and off by default; only its (shared, read-only)
# lofty dependency became unconditional.
probe = []

# Gates the F-606 kill-recovery harness binary (src/bin/kill_harness.rs) and its
# tokio dependency. Off by default so a normal `cargo build` never produces it;
# the self dev-dependency below turns it on for `cargo test -p abo-core`, which is
# what makes `CARGO_BIN_EXE_kill_harness` available to tests/kill_recovery.rs.
kill-harness = ["dep:tokio"]

# The harness is a real, killable process rather than a test function - see its
# module docs for why an in-process test cannot stand in for it.
[[bin]]
name = "kill_harness"
path = "src/bin/kill_harness.rs"
required-features = ["kill-harness"]

# tokio is a TEST-ONLY dependency: the library's async fns run on whatever
# runtime the caller (the shell) provides, and sqlx's runtime integration is
# pulled via its `runtime-tokio` feature. Tests need the `#[tokio::test]` macro
# (the `macros` + `rt` features) and a runtime; it inherits the workspace
# `full` feature set, which is a superset of those. tempfile backs the temp-dir
# tests. serde_json backs the error-taxonomy serialization tests only.
# Self dev-dependency, `fixtures` feature enabled: this is what makes
# `crate::fixtures` (gated `cfg(feature = "fixtures")`) visible to
# integration tests under tests/*.rs, which are separate compilation units
# and do not see the library's own `cfg(test)`. Cargo unifies features
# across a package's whole dev-dependency graph for `cargo test`, so this is
# enough for every Phase 2-5 integration test to `use abo_core::fixtures::*`
# without passing --features explicitly. Verified by
# tests/fixtures_integration_smoke.rs.
[dev-dependencies]
abo-core = { path = ".", features = ["fixtures", "kill-harness"] }
tokio = { workspace = true }
tempfile = "3"
# serde_json is now a NORMAL dependency (see above, F-801 ruleset JSON), so it
# no longer needs restating here; the error-taxonomy tests that first used it
# inherit it from the normal dependency graph.
# tests/tracing_log_bridge.rs drives the tracing -> log facade bridge directly,
# so the integration-test crate names both crates. Integration tests do not
# inherit the library's normal dependencies (see sqlx below), so they are
# restated here. `tracing` restates the `log` feature so the bridge is active in
# the test build as well (features unify with the library's own normal dep).
tracing = { workspace = true, features = ["log"] }
# `std` is needed for `log::set_boxed_logger` used by the bridge test.
log = { version = "0.4", features = ["std"] }
# The scanner integration tests (tests/scan.rs) hold the SqlitePool returned by
# open_db and query the scans table directly to prove snapshot immutability
# (AC-13). Integration tests are separate crates and do not inherit the library's
# normal dependencies, so sqlx is restated here (feature set matches the lib).
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
# v0.2.0 Phase 5 (F-201/F-202/F-203 classification goldens): insta drives the
# committed snapshot tests for folder classification, health metrics, and
# multi-book flags over the P1 fixture library (tests/classification_golden.rs).
# Dev-dependency only: insta never reaches the production build, so core purity
# is unaffected. No pin exists in the reference project
# (E:/Projects/product-on-purpose/repo-sync-tool); pinned EXACT here so a silent
# insta bump cannot churn the committed snapshots. `default-features = false`
# drops insta's optional format features (yaml/json/ron) that would pull extra
# crates; the goldens use the plain-string `assert_snapshot!` only.
insta = { version = "=1.48.0", default-features = false }

# v0.2.0 Phase 7 (real-library baseline-delta report, tests/real_library_scan.rs):
# the ignored real-library test computes DISCOVERY-COMPARABLE per-type noise
# presence counts (marker appears anywhere in a name, matching how the FD-18
# 2026-03-25 baselines were derived), distinct from the product's anchored strip
# passes. regex is already a NORMAL dependency of the crate, but integration
# tests are separate compilation units that do not inherit normal deps, so it is
# restated here for that one test. Dev-dependency only: no effect on core purity
# or the shipped build.
regex = "1"

# v0.2.0 Phase 4a (F-302 noise strippers): the idempotence property
# `strip(strip(x)) == strip(x)` (AC-302.2) is a proptest property test over a
# generator that composes realistic name fragments and arbitrary unicode
# strings. Dev-dependency only: proptest never reaches the production build,
# so core purity is unaffected. No pinned version exists yet in the reference
# project (E:/Projects/product-on-purpose/repo-sync-tool), so this pins the
# current stable major version.
proptest = "1"
