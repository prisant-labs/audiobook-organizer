<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiobook Organizer</title>
    <script>
      // Pre-paint theme application (AC-2): avoids a flash of the default
      // theme before the module script in src/main.tsx runs. The storage key
      // ("abo.theme") and the day/evening default must stay in sync with
      // src/lib/theme.ts; this is the one place that logic is duplicated,
      // and only because it must run before any module script can.
      (function () {
        try {
          var stored = window.localStorage.getItem("abo.theme");
          document.documentElement.dataset.theme = stored === "evening" ? "evening" : "day";
        } catch (e) {
          document.documentElement.dataset.theme = "day";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
